name: Smoke tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
      - run: node tests/study.cjs
      - run: node tests/cloudflare-prototype.cjs
      - run: npm ci --prefix prototype/cloudflare --ignore-scripts --no-audit --no-fund
      - run: node prototype/cloudflare/test-d1.cjs
