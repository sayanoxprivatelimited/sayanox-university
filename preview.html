<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-OgEkOYpa7huIPl3sEPBchVb0g2Mqcml6+arVydVL1/s=' blob:; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Sandboxed practice preview</title></head><body><script>// Runs only in an opaque-origin sandbox. Its separate CSP blocks network and forms.
window.addEventListener('message', event => {
  if (event.source !== parent || !event.data || typeof event.data.markup !== 'string') return;
  const doc = new DOMParser().parseFromString(event.data.markup, 'text/html');

  doc.querySelectorAll('script, base, meta, link').forEach(node => node.remove());
  document.head.querySelectorAll('style').forEach(node => node.remove());
  doc.head.querySelectorAll('style').forEach(node => document.head.appendChild(node));
  document.body.replaceChildren(...doc.body.childNodes);

    for (const code of scripts) {
      const script = document.createElement('script');
      script.async = false;
      script.src = URL.createObjectURL(new Blob([code], {type: 'text/javascript'}));
      script.onload = script.onerror = () => URL.revokeObjectURL(script.src);
      document.body.appendChild(script);
    }
  }
